<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMBOT</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #130008 0%,
            #050002 38%,
            #000 72%
        );

    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}

/* -------------------------------------------------- */
/* START CARD */
/* -------------------------------------------------- */

.start-card {
    position: fixed;

    width: 270px;
    height: 245px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 27px;

    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            rgba(31, 5, 18, .97),
            rgba(11, 3, 8, .98)
        );

    border:
        1px solid
        rgba(100, 0, 38, .23);

    box-shadow:
        0 0 35px
        rgba(120, 0, 45, .12),

        inset 0 0 35px
        rgba(255, 0, 60, .025);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.start-card.hide {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.88);

    pointer-events: none;
}

/* -------------------------------------------------- */
/* SMALL FLOWER ON CARD */
/* -------------------------------------------------- */

.card-flower {

    position: relative;

    width: 32px;
    height: 43px;

    margin-bottom: 11px;
}

.card-stem {

    position: absolute;

    width: 3px;
    height: 20px;

    left: 15px;
    bottom: 0;

    background:
        linear-gradient(
            #38a653,
            #126124
        );

    border-radius: 10px;
}

.card-leaf {

    position: absolute;

    width: 11px;
    height: 5px;

    border-radius:
        100% 0 100% 0;

    background: #25943f;
}

.card-leaf.one {

    left: 5px;
    bottom: 8px;

    transform:
        rotate(-20deg);
}

.card-leaf.two {

    right: 4px;
    bottom: 12px;

    transform:
        rotate(25deg)
        scaleX(-1);
}

.card-bloom {

    position: absolute;

    width: 18px;
    height: 19px;

    left: 7px;
    top: 1px;

    border-radius:
        50% 50% 45% 45%;

    background:
        radial-gradient(
            circle at 45% 35%,
            #ff4b6d,
            #e40042 45%,
            #72001f
        );

    box-shadow:
        0 0 12px
        rgba(255, 0, 55, .65);
}

/* -------------------------------------------------- */
/* TITLE */
/* -------------------------------------------------- */

.start-card h1 {

    font-size: 22px;

    color: #eee7e9;

    font-weight: bold;

    letter-spacing: -.5px;

    margin-bottom: 16px;
}

/* -------------------------------------------------- */
/* DIVIDER */
/* -------------------------------------------------- */

.divider {

    width: 220px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(105, 38, 58, .55),
            transparent
        );

    margin-bottom: 10px;
}

/* -------------------------------------------------- */
/* STATUS */
/* -------------------------------------------------- */

.status {

    color: #b6a2a9;

    font-family:
        monospace;

    font-size: 8px;

    margin-bottom: 20px;
}

/* -------------------------------------------------- */
/* BUTTON */
/* -------------------------------------------------- */

#bloomButton {

    width: 220px;
    height: 37px;

    border: none;

    border-radius: 7px;

    background:
        linear-gradient(
            180deg,
            #30282c,
            #282125
        );

    color: #9b9094;

    font-family:
        monospace;

    font-size: 9px;

    letter-spacing: .3px;

    cursor: pointer;

    transition:
        .25s ease;
}

#bloomButton:hover {

    color: #fff;

    background:
        linear-gradient(
            180deg,
            #e20b4b,
            #a00030
        );

    box-shadow:
        0 0 18px
        rgba(255, 0, 65, .35);
}

#bloomButton:active {

    transform: scale(.98);
}

/* -------------------------------------------------- */
/* CANVAS */
/* -------------------------------------------------- */

#flowerCanvas {

    position: fixed;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    opacity: 0;

    transition:
        opacity 1.2s ease;

    pointer-events: none;
}

#flowerCanvas.show {

    opacity: 1;
}

/* -------------------------------------------------- */
/* MESSAGE */
/* -------------------------------------------------- */

.message {

    position: fixed;

    left: 50%;
    top: 72%;

    transform:
        translate(-50%, 15px);

    text-align: center;

    z-index: 8;

    opacity: 0;

    color: #d9c2c8;

    font-size: 19px;

    line-height: 1.15;

    font-style: italic;

    letter-spacing: .5px;

    text-shadow:
        0 0 8px
        rgba(255, 0, 60, .35),

        0 0 20px
        rgba(255, 0, 50, .12);

    transition:
        opacity 1.6s ease,
        transform 1.6s ease;
}

.message.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}

.message small {

    display: block;

    margin-top: 15px;

    font-size: 18px;

    color: #ef315c;

    text-shadow:
        0 0 12px
        rgba(255, 0, 65, .65);
}

/* -------------------------------------------------- */
/* MOBILE */
/* -------------------------------------------------- */

@media(max-width: 600px) {

    .start-card {

        width: 270px;
        height: 245px;
    }

    .message {

        top: 73%;

        font-size: 17px;
    }
}

</style>
</head>

<body>


<!-- ================================================= -->
<!-- START CARD -->
<!-- ================================================= -->

<div class="start-card" id="startCard">

    <div class="card-flower">

        <div class="card-bloom"></div>

        <div class="card-stem"></div>

        <div class="card-leaf one"></div>
        <div class="card-leaf two"></div>

    </div>

    <h1>TAP IT PLEASE</h1>

    <div class="divider"></div>

    <div class="status" id="status">
        Ready to compile ...
    </div>

    <button id="bloomButton">
        TAP TO BLOOM
    </button>

</div>


<!-- ================================================= -->
<!-- FLOWER CANVAS -->
<!-- ================================================= -->

<canvas id="flowerCanvas"></canvas>


<!-- ================================================= -->
<!-- MESSAGE -->
<!-- ================================================= -->

<div class="message" id="message">

 wala ko obrahon so gin obra ko ni

    <small>🌹</small>

</div>


<!-- ================================================= -->
<!-- MUSIC -->
<!-- ================================================= -->

<audio
    id="music"
    src="music.mp3"
    preload="auto">
</audio>


<script>

/* ================================================= */
/* CANVAS */
/* ================================================= */

const canvas =
    document.getElementById("flowerCanvas");

const ctx =
    canvas.getContext("2d");

let width;
let height;

let scale;


/* ================================================= */
/* RESIZE */
/* ================================================= */

function resize() {

    width =
        canvas.width =
        window.innerWidth *
        window.devicePixelRatio;

    height =
        canvas.height =
        window.innerHeight *
        window.devicePixelRatio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );

    scale =
        Math.min(
            window.innerWidth / 576,
            window.innerHeight / 1024
        );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* ================================================= */
/* ELEMENTS */
/* ================================================= */

const button =
    document.getElementById(
        "bloomButton"
    );

const card =
    document.getElementById(
        "startCard"
    );

const status =
    document.getElementById(
        "status"
    );

const music =
    document.getElementById(
        "music"
    );

const message =
    document.getElementById(
        "message"
    );


/* ================================================= */
/* STATE */
/* ================================================= */

let started = false;

let startTime = 0;

let particles = [];

let petals = [];


/* ================================================= */
/* FLOWER POSITION */
/* ================================================= */

function flowerPosition() {

    return {

        x:
            window.innerWidth / 2,

        y:
            window.innerHeight * .48

    };

}


/* ================================================= */
/* PETAL DATA */
/* ================================================= */

const PETAL_LAYERS = [

    {
        count: 10,
        radius: 13,
        width: 22,
        height: 38,
        delay: 2.7,
        spread: 1.0
    },

    {
        count: 11,
        radius: 27,
        width: 28,
        height: 48,
        delay: 3.3,
        spread: 1.05
    },

    {
        count: 12,
        radius: 40,
        width: 34,
        height: 55,
        delay: 4.0,
        spread: 1.08
    },

    {
        count: 13,
        radius: 54,
        width: 39,
        height: 62,
        delay: 4.7,
        spread: 1.1
    },

    {
        count: 14,
        radius: 68,
        width: 43,
        height: 69,
        delay: 5.4,
        spread: 1.12
    }

];


/* ================================================= */
/* CREATE PETALS */
/* ================================================= */

function createPetals() {

    petals = [];

    PETAL_LAYERS.forEach(
        (layer, layerIndex) => {

            const angleStep =
                Math.PI * 2 /
                layer.count;

            for (
                let i = 0;
                i < layer.count;
                i++
            ) {

                const angle =
                    angleStep * i +
                    (
                        Math.random() -
                        .5
                    ) * .18;

                petals.push({

                    layer: layerIndex,

                    angle: angle,

                    radius:
                        layer.radius *
                        (.94 +
                        Math.random() * .12),

                    width:
                        layer.width *
                        (.90 +
                        Math.random() * .20),

                    height:
                        layer.height *
                        (.90 +
                        Math.random() * .18),

                    delay:
                        layer.delay +
                        Math.random() * .22,

                    bloom:
                        0,

                    rotation:
                        angle +
                        Math.PI / 2 +

                        (
                            Math.random() -
                            .5
                        ) * .18,

                    curve:
                        .94 +
                        Math.random() * .12,

                    wave:
                        Math.random() *
                        Math.PI * 2

                });

            }

        }
    );

}


/* ================================================= */
/* EASING */
/* ================================================= */

function easeOutBack(t) {

    const c1 = 1.70158;

    const c3 =
        c1 + 1;

    return 1 +
        c3 *
        Math.pow(
            t - 1,
            3
        ) +
        c1 *
        Math.pow(
            t - 1,
            2
        );
}


function easeOutCubic(t) {

    return 1 -
        Math.pow(
            1 - t,
            3
        );
}


/* ================================================= */
/* DRAW PETAL */
/* ================================================= */

function drawPetal(
    x,
    y,
    angle,
    w,
    h,
    bloom,
    layer
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        angle
    );

    const bw =
        w * bloom;

    const bh =
        h * bloom;


    /* ------------------------------------------------ */
    /* PETAL GRADIENT */
    /* ------------------------------------------------ */

    const gradient =
        ctx.createRadialGradient(
            0,
            -bh * .35,
            2,
            0,
            -bh * .2,
            bh
        );


    if (layer === 0) {

        gradient.addColorStop(
            0,
            "#ff315b"
        );

        gradient.addColorStop(
            .55,
            "#e40042"
        );

        gradient.addColorStop(
            1,
            "#720020"
        );

    } else {

        gradient.addColorStop(
            0,
            "#ff2453"
        );

        gradient.addColorStop(
            .48,
            "#df003b"
        );

        gradient.addColorStop(
            1,
            "#68001d"
        );

    }


    ctx.fillStyle =
        gradient;


    /* ------------------------------------------------ */
    /* SOFT PETAL GLOW */
    /* ------------------------------------------------ */

    ctx.shadowColor =
        "rgba(255,0,55,.35)";

    ctx.shadowBlur =
        8 + layer * 2;


    /* ------------------------------------------------ */
    /* PETAL SHAPE */
    /* ------------------------------------------------ */

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(

        -bw * .78,
        -bh * .18,

        -bw * .72,
        -bh * .82,

        0,
        -bh

    );

    ctx.bezierCurveTo(

        bw * .72,
        -bh * .82,

        bw * .78,
        -bh * .18,

        0,
        0

    );

    ctx.closePath();

    ctx.fill();


    /* ------------------------------------------------ */
    /* PETAL INNER SHADOW */
    /* ------------------------------------------------ */

    ctx.shadowBlur = 0;

    const inner =
        ctx.createLinearGradient(
            0,
            0,
            0,
            -bh
        );

    inner.addColorStop(
        0,
        "rgba(50,0,15,.45)"
    );

    inner.addColorStop(
        .45,
        "rgba(255,50,80,.06)"
    );

    inner.addColorStop(
        1,
        "rgba(255,70,100,.14)"
    );

    ctx.fillStyle =
        inner;

    ctx.globalAlpha =
        .5;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -bh * .05
    );

    ctx.bezierCurveTo(

        -bw * .30,
        -bh * .35,

        -bw * .25,
        -bh * .70,

        0,
        -bh * .90

    );

    ctx.bezierCurveTo(

        bw * .25,
        -bh * .70,

        bw * .30,
        -bh * .35,

        0,
        -bh * .05

    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* ================================================= */
/* DRAW STEM */
/* ================================================= */

function drawStem(
    x,
    y,
    progress
) {

    if (progress <= 0) {
        return;
    }

    const stemHeight =
        180 *
        easeOutCubic(
            Math.min(progress, 1)
        );

    ctx.save();

    ctx.lineCap =
        "round";

    /* glow */

    ctx.shadowColor =
        "rgba(25,180,70,.3)";

    ctx.shadowBlur =
        8;

    const stemGradient =
        ctx.createLinearGradient(
            x,
            y + 10,
            x,
            y + stemHeight
        );

    stemGradient.addColorStop(
        0,
        "#32a84e"
    );

    stemGradient.addColorStop(
        .5,
        "#168d39"
    );

    stemGradient.addColorStop(
        1,
        "#06451b"
    );

    ctx.strokeStyle =
        stemGradient;

    ctx.lineWidth =
        4;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x,
        y + stemHeight
    );

    ctx.stroke();

    ctx.restore();


    /* leaves */

    if (progress > .35) {

        const leafProgress =
            easeOutCubic(
                Math.min(
                    (progress - .35) /
                    .35,
                    1
                )
            );

        drawLeaf(
            x,
            y + 72,
            -1,
            leafProgress
        );

        drawLeaf(
            x,
            y + 105,
            1,
            leafProgress
        );
    }

}


/* ================================================= */
/* DRAW LEAF */
/* ================================================= */

function drawLeaf(
    x,
    y,
    direction,
    progress
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        direction *
        .35
    );

    const w =
        48 *
        progress;

    const h =
        17 *
        progress;

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            direction * w,
            -h
        );

    gradient.addColorStop(
        0,
        "#0c5624"
    );

    gradient.addColorStop(
        .5,
        "#22a746"
    );

    gradient.addColorStop(
        1,
        "#0b6429"
    );

    ctx.fillStyle =
        gradient;

    ctx.shadowColor =
        "rgba(0,130,45,.25)";

    ctx.shadowBlur =
        5;

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(

        direction * w * .35,
        -h * 1.1,

        direction * w * .8,
        -h * 1.05,

        direction * w,
        0

    );

    ctx.bezierCurveTo(

        direction * w * .65,
        h * .7,

        direction * w * .25,
        h * .45,

        0,
        0

    );

    ctx.fill();

    ctx.restore();

}


/* ================================================= */
/* DRAW BUD */
/* ================================================= */

function drawBud(
    x,
    y,
    progress
) {

    if (progress <= 0) {
        return;
    }

    const p =
        easeOutBack(
            Math.min(
                progress,
                1
            )
        );

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        p,
        p
    );

    const gradient =
        ctx.createRadialGradient(
            0,
            -18,
            2,
            0,
            -10,
            30
        );

    gradient.addColorStop(
        0,
        "#ff365e"
    );

    gradient.addColorStop(
        .45,
        "#dc003b"
    );

    gradient.addColorStop(
        1,
        "#570019"
    );

    ctx.fillStyle =
        gradient;

    ctx.shadowColor =
        "rgba(255,0,55,.6)";

    ctx.shadowBlur =
        20;

    ctx.beginPath();

    ctx.moveTo(
        -23,
        0
    );

    ctx.bezierCurveTo(
        -28,
        -28,
        -15,
        -47,
        0,
        -50
    );

    ctx.bezierCurveTo(
        15,
        -47,
        28,
        -28,
        23,
        0
    );

    ctx.bezierCurveTo(
        12,
        7,
        -12,
        7,
        -23,
        0
    );

    ctx.fill();

    ctx.restore();

}


/* ================================================= */
/* DRAW ROSE */
/* ================================================= */

function drawRose(
    elapsed
) {

    const pos =
        flowerPosition();

    const x =
        pos.x;

    const y =
        pos.y;


    /* ------------------------------------------------ */
    /* STEM */
    /* ------------------------------------------------ */

    const stemProgress =
        Math.min(
            elapsed / 2.5,
            1
        );

    drawStem(
        x,
        y,
        stemProgress
    );


    /* ------------------------------------------------ */
    /* BUD */
    /* ------------------------------------------------ */

    const budProgress =
        Math.max(
            0,
            Math.min(
                (elapsed - 2.1) / 1.4,
                1
            )
        );

    if (
        elapsed < 4.0
    ) {

        drawBud(
            x,
            y,
            budProgress
        );

    }


    /* ------------------------------------------------ */
    /* PETALS */
    /* ------------------------------------------------ */

    petals.forEach(
        petal => {

            const t =
                Math.max(
                    0,
                    Math.min(
                        (elapsed -
                         petal.delay) /
                        1.8,
                        1
                    )
                );

            if (t <= 0) {
                return;
            }

            const bloom =
                easeOutBack(t);


            const radius =
                petal.radius *
                bloom;

            const px =
                x +
                Math.cos(
                    petal.angle
                ) *
                radius;

            const py =
                y -
                20 +
                Math.sin(
                    petal.angle
                ) *
                radius *
                .38;


            drawPetal(

                px,
                py,

                petal.rotation,

                petal.width,

                petal.height,

                bloom,

                petal.layer

            );

        }
    );

}


/* ================================================= */
/* PARTICLES */
/* ================================================= */

function createParticle() {

    const pos =
        flowerPosition();

    particles.push({

        x:
            pos.x +
            (Math.random() - .5) *
            190,

        y:
            pos.y -
            20 +
            (Math.random() - .5) *
            130,

        vx:
            (Math.random() - .5) *
            .35,

        vy:
            -.2 -
            Math.random() *
            .45,

        life:
            1,

        size:
            1 +
            Math.random() * 2

    });

}


/* ================================================= */
/* DRAW PARTICLES */
/* ================================================= */

function drawParticles() {

    particles.forEach(
        particle => {

            particle.x +=
                particle.vx;

            particle.y +=
                particle.vy;

            particle.life -=
                .008;

            ctx.save();

            ctx.globalAlpha =
                Math.max(
                    particle.life,
                    0
                );

            ctx.fillStyle =
                "#e90043";

            ctx.shadowColor =
                "#ff174f";

            ctx.shadowBlur =
                10;

            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();

        }
    );

    particles =
        particles.filter(
            p =>
                p.life > 0
        );

}


/* ================================================= */
/* ANIMATION */
/* ================================================= */

function animate(
    timestamp
) {

    if (!started) {
        return;
    }


    const elapsed =
        (timestamp -
         startTime) /
        1000;


    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    /* ------------------------------------------------ */
    /* RED BACKGROUND GLOW */
    /* ------------------------------------------------ */

    const pos =
        flowerPosition();

    const glow =
        ctx.createRadialGradient(
            pos.x,
            pos.y - 30,
            5,
            pos.x,
            pos.y - 30,
            260
        );

    glow.addColorStop(
        0,
        "rgba(130,0,38,.30)"
    );

    glow.addColorStop(
        .35,
        "rgba(75,0,25,.15)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    /* ------------------------------------------------ */
    /* FLOWER */
    /* ------------------------------------------------ */

    drawRose(
        elapsed
    );


    /* ------------------------------------------------ */
    /* PARTICLES */
    /* ------------------------------------------------ */

    if (
        elapsed > 4 &&
        Math.random() < .13
    ) {

        createParticle();

    }

    drawParticles();


    requestAnimationFrame(
        animate
    );

}


/* ================================================= */
/* MUSIC */
/* ================================================= */

function startMusic() {

    music.currentTime =
        0;

    music.volume =
        0;

    const play =
        music.play();

    if (
        play !== undefined
    ) {

        play.catch(
            () => {

                console.log(
                    "Browser blocked audio."
                );

            }
        );

    }


    /* Smooth music fade */

    let volume =
        0;

    const fade =
        setInterval(
            () => {

                volume +=
                    .025;

                music.volume =
                    Math.min(
                        volume,
                        .75
                    );

                if (
                    volume >= .75
                ) {

                    clearInterval(
                        fade
                    );

                }

            },
            80
        );

}


/* ================================================= */
/* START BLOOM */
/* ================================================= */

button.addEventListener(
    "click",
    () => {

        if (started) {
            return;
        }

        started =
            true;


        /* Change text */

        status.textContent =
            "Compiling...";


        /* Start music */

        startMusic();


        /* Prepare petals */

        createPetals();


        /* Fade card */

        setTimeout(
            () => {

                card.classList.add(
                    "hide"
                );

                canvas.classList.add(
                    "show"
                );

            },
            350
        );


        /*
            Flower animation begins
            here.
        */

        setTimeout(
            () => {

                startTime =
                    performance.now();

                requestAnimationFrame(
                    animate
                );

            },
            900
        );


        /* Message */

        setTimeout(
            () => {

                message.classList.add(
                    "show"
                );

            },
            7900
        );

    }
);

</script>

</body>
</html>
